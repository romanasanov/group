<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сессия · дашборд</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EC; --bg2:#EDEAE4; --ink:#1A1714; --ink2:#6B6058; --ink3:#A09890;
  --red:#8B2020; --red2:#6B1818; --cream:#F4F1EC;
  --green:#2D6A4F; --green2:#40916C;
  --blue:#1A4B8B; --blue2:#2563EB;
  --line:#D5CFC6;
  --warn:#B5451B; --urgent:#8B2020;
  --r:4px; --safe-b:env(safe-area-inset-bottom,16px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif}
button,input,textarea,select{font-family:'Jost',sans-serif}
button{cursor:pointer;border:none;background:none}

/* ── SHELL ── */
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto}

/* ── TABBAR ── */
#tabbar{display:flex;border-bottom:2px solid var(--ink);background:var(--bg);flex:none}
.tbtn{flex:1;padding:13px 4px 11px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);border-bottom:3px solid transparent;transition:color .15s;font-weight:500}
.tbtn.active{color:var(--ink);border-bottom-color:var(--red)}
.tbtn .ti{font-size:16px;display:block;margin-bottom:4px}

/* ── PAGES ── */
.page{display:none;flex:1;flex-direction:column;overflow:hidden}
.page.active{display:flex}

/* ══════════════════════════════════════
   SESSION PAGE
══════════════════════════════════════ */
#session-page{position:relative;display:flex;flex-direction:column;overflow:hidden;height:100%}

/* HERO — always visible */
#hero{
  flex:none;background:var(--ink);color:var(--cream);
  padding:18px 22px 16px;
  transition:background .5s;
}
#hero.switching{animation:blockSwitch .5s ease}
@keyframes blockSwitch{
  0%{background:var(--red)}
  40%{background:var(--red2)}
  100%{background:var(--ink)}
}
#hero-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
#hero-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,241,236,.45);font-weight:400}
#hero-clock{font-size:12px;font-variant-numeric:tabular-nums;color:rgba(244,241,236,.45)}
#hero-name{font-size:20px;font-weight:600;line-height:1.2;letter-spacing:-.01em;color:var(--cream);margin-bottom:14px;min-height:28px}
#hero-timer{font-size:84px;font-weight:700;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--cream);transition:color .4s}
#hero-timer.warn{color:#F5C518}
#hero-timer.urgent{color:#FF6B6B;animation:tpulse 1s ease infinite}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.5}}

/* hero progress */
#hero-prog-wrap{height:3px;background:rgba(244,241,236,.15);margin-top:14px;border-radius:1px;overflow:hidden}
#hero-prog{height:100%;background:var(--cream);opacity:.7;border-radius:1px;transition:width 1s linear}
#hero-prog.warn{background:#F5C518;opacity:1}
#hero-prog.urgent{background:#FF6B6B;opacity:1}
#hero-sub{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:rgba(244,241,236,.4);font-variant-numeric:tabular-nums}

/* CONTROLS — always visible */
#controls{
  flex:none;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:11px 18px 12px;display:flex;gap:8px;align-items:center
}
#btn-prev,#btn-next{
  padding:10px 16px;background:var(--bg);border:1px solid var(--line);
  color:var(--ink2);font-size:13px;font-weight:500;letter-spacing:.04em;
  border-radius:var(--r);transition:background .12s
}
#btn-prev:active,#btn-next:active{background:var(--line)}
#btn-play{
  flex:1;padding:12px 0;background:var(--red);color:var(--cream);
  font-size:15px;font-weight:600;letter-spacing:.06em;border-radius:var(--r);
  transition:background .15s
}
#btn-play:active{background:var(--red2)}
#btn-play.playing{background:var(--ink)}

/* finish row */
#finish-row{
  flex:none;background:var(--bg);border-bottom:1px solid var(--line);
  padding:9px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px
}
#finish-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#finish-icon{font-size:14px}
#finish-text{font-size:13px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
#finish-delta{font-size:12px;padding:2px 8px;border-radius:2px;font-weight:500}
#finish-delta.ahead{background:rgba(45,106,79,.12);color:var(--green2)}
#finish-delta.behind{background:rgba(139,32,32,.1);color:var(--red)}
#finish-delta.exact{background:var(--bg2);color:var(--ink3)}
#btn-promise{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:4px 8px;border:1px solid var(--line);border-radius:2px}
#promise-panel{flex:none;background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 22px;display:none}
.promise-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.ptime-inp{width:58px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 6px;border-radius:var(--r)}
.ptime-inp:focus{outline:none;border-color:var(--red)}

/* DRAWER — scrollable bottom */
#drawer{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
  min-height:0;
}
.drawer-handle{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 22px;background:var(--bg2);border-bottom:1px solid var(--line);
  cursor:pointer;flex:none;user-select:none
}
.drawer-handle-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.drawer-handle-icon{font-size:12px;color:var(--ink3);transition:transform .25s}
.drawer-handle-icon.open{transform:rotate(180deg)}
.drawer-section{transition:max-height .35s ease;overflow:hidden}
.drawer-section.open{overflow:visible;max-height:none!important}
.drawer-section.closed{max-height:0!important;overflow:hidden}
.drawer-inner{padding:14px 22px 20px;display:flex;flex-direction:column;gap:10px}

/* HINT */
#hint-box{
  background:var(--bg);border-left:3px solid var(--red);
  padding:12px 14px;font-size:14px;line-height:1.55;color:var(--ink);
  white-space:pre-line;font-weight:400
}

/* BLOCK LIST */
#block-list{display:flex;flex-direction:column}
.brow{
  display:flex;align-items:baseline;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s
}
.brow:last-child{border-bottom:none}
.brow:active{background:var(--bg2)}
.brow.done .bt,.brow.done .bn,.brow.done .bd{color:var(--ink3);opacity:.5}
.brow.active{background:var(--bg2);margin:0 -22px;padding:10px 22px;border-bottom:1px solid var(--line)}
.brow.active .bn{color:var(--ink);font-weight:700;font-size:16px}
.brow.active .bt{color:var(--red)}
.bt{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:40px;font-weight:400}
.bn{flex:1;font-size:15px;color:var(--ink2);line-height:1.3;font-weight:400}
.bd{font-size:12px;color:var(--ink3);min-width:26px;text-align:right;font-weight:400}

/* TOTAL BAR */
#total-row{display:flex;gap:10px;align-items:center}
#total-label{font-size:11px;color:var(--ink3);white-space:nowrap}
.tot-bar{flex:1;height:2px;background:var(--line);border-radius:1px;overflow:hidden}
.tot-fill{height:100%;background:var(--red);border-radius:1px;transition:width 1s linear}
#total-end{font-size:11px;color:var(--ink3);white-space:nowrap}

/* BALINT */
#balint-panel{display:flex;flex-direction:column;gap:8px}
#balint-header{display:flex;align-items:center;justify-content:space-between}
#balint-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
#balint-badge{font-size:12px;background:rgba(139,32,32,.08);color:var(--red);border:1px solid rgba(139,32,32,.2);padding:3px 10px;font-weight:500}
.bstep{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.bstep:last-child{border-bottom:none}
.bsn{font-size:11px;color:var(--ink3);width:16px;flex:none;padding-top:2px;font-weight:400}
.bsname{flex:1;font-size:13.5px;color:var(--ink2);line-height:1.3;font-weight:400}
.bsnote{font-size:11px;color:var(--ink3);display:block;margin-top:1px}
.bsdur{font-size:11px;color:var(--ink3);flex:none;font-weight:400}
.bstep.bs-active .bsname{color:var(--ink);font-weight:700}
.bstep.bs-active .bsn{color:var(--red);font-weight:700}
.bstep.bs-done .bsname,.bstep.bs-done .bsnote{color:var(--ink3);text-decoration:line-through;opacity:.5}
#balint-nav{display:flex;gap:8px;margin-top:4px}
#balint-nav button{flex:1;padding:10px 0;border:1px solid var(--line);font-size:13px;font-weight:500;letter-spacing:.04em;border-radius:var(--r)}
#bp-prev-btn{color:var(--ink2)}
#bp-next-btn{background:var(--red);color:var(--cream);border-color:var(--red)}
#bp-next-btn.done{background:var(--bg2);color:var(--green2);border-color:var(--green2)}
#bp-prog-wrap{height:2px;background:var(--line);border-radius:1px;overflow:hidden}
#bp-prog{height:100%;background:var(--red);border-radius:1px;transition:width .4s}

/* ══════════════════════════════════════
   ADMIN PAGE
══════════════════════════════════════ */
#admin-page{overflow-y:auto;-webkit-overflow-scrolling:touch}
.admin-inner{padding:18px 22px 32px;display:flex;flex-direction:column;gap:14px}
.admin-card{background:var(--bg);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.admin-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:2px}
.fl{font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:400}
.fi{background:var(--bg2);border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:400;padding:9px 12px;width:100%;border-radius:var(--r)}
.fi:focus{outline:none;border-color:var(--red)}
.fi-num{width:64px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums;font-weight:600;padding:8px 6px}
.fi-sm{width:60px;text-align:center}
.fi-ta{resize:none;min-height:52px;font-size:13px;line-height:1.45}
.fi-row{display:flex;gap:8px;align-items:center}
.sep{color:var(--ink3);font-size:18px}

/* block editor rows */
.be{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}
.be:last-child{border-bottom:none}
.be-row{display:flex;gap:6px;align-items:flex-start}
.be-idx{font-size:11px;color:var(--ink3);width:20px;padding-top:10px;text-align:right;flex:none}
.be-fields{flex:1;display:flex;flex-direction:column;gap:5px}
.be-top{display:flex;gap:6px}
.be-name{flex:1}
.be-dur{width:58px;text-align:center}
.be-del{color:var(--ink3);font-size:18px;padding:6px 4px;align-self:flex-start;flex:none;margin-top:2px}
.be-del:hover{color:var(--red)}
.drag-h{color:var(--ink2);font-size:15px;padding:8px 3px;align-self:flex-start;flex:none;margin-top:3px;cursor:grab;touch-action:none;user-select:none}
.drag-h:active{cursor:grabbing;color:var(--ink)}
.be.dragging{opacity:.35;background:var(--bg2)}
.be.drag-over{border-top:2px solid var(--blue2)}
.add-row{background:none;border:1px dashed var(--line);color:var(--ink3);padding:10px;font-size:13px;width:100%;border-radius:var(--r);margin-top:6px;letter-spacing:.04em}
.add-row:hover{border-color:var(--ink3);color:var(--ink)}

.balint-toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle{width:36px;height:20px;background:var(--line);border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle.on{background:var(--red)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(16px)}

.btn-apply{background:var(--ink);color:var(--cream);padding:13px 0;font-size:14px;font-weight:600;letter-spacing:.06em;width:100%;border-radius:var(--r)}
.btn-reset{background:none;border:1px solid var(--line);color:var(--ink3);padding:11px 0;font-size:13px;font-weight:400;letter-spacing:.04em;width:100%;border-radius:var(--r)}

/* SWITCH FLASH */
#flash{position:fixed;inset:0;background:var(--red);pointer-events:none;opacity:0;z-index:99;transition:opacity .3s}
#flash.show{animation:flashAnim .5s ease forwards}
@keyframes flashAnim{0%{opacity:.25}100%{opacity:0}}

/* scrollbar */
#drawer::-webkit-scrollbar,#admin-page::-webkit-scrollbar{width:3px}
#drawer::-webkit-scrollbar-thumb,#admin-page::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
</style>
</head>
<body>
<div id="app">

  <!-- TABBAR -->
  <div id="tabbar">
    <button class="tbtn active" id="tbtn-session" onclick="showTab('session')">
      <span class="ti">⏱</span>Сессия
    </button>
    <button class="tbtn" id="tbtn-admin" onclick="showTab('admin')">
      <span class="ti">⚙️</span>Настройка
    </button>
  </div>

  <!-- ══ SESSION PAGE ══ -->
  <div class="page active" id="session-page">

    <!-- HERO — fixed top -->
    <div id="hero">
      <div id="hero-top">
        <span id="hero-label">блок — / —</span>
        <div style="display:flex;align-items:center;gap:10px">
          <button id="btn-font" onclick="cycleFontSize()" style="background:rgba(244,241,236,.12);border:none;color:rgba(244,241,236,.6);font-family:'Jost',sans-serif;font-size:12px;font-weight:500;padding:3px 9px;border-radius:2px;cursor:pointer;letter-spacing:.06em">А</button>
          <span id="hero-clock">00:00:00</span>
        </div>
      </div>
      <div id="hero-name">—</div>
      <div id="hero-timer">00:00</div>
      <div id="hero-prog-wrap"><div id="hero-prog" style="width:0%"></div></div>
      <div id="hero-sub">
        <span id="hero-elapsed">0:00 прошло</span>
        <span id="hero-planned">план —</span>
      </div>
    </div>

    <!-- CONTROLS -->
    <div id="controls">
      <button id="btn-prev" onclick="prevAction()">← назад</button>
      <button id="btn-play" onclick="togglePlay()">▶ старт</button>
      <button id="btn-next" onclick="nextAction()">вперёд →</button>
    </div>

    <!-- FINISH ROW -->
    <div id="finish-row">
      <div id="finish-left">
        <span id="finish-icon">⏳</span>
        <span id="finish-text">закончим в —</span>
        <span id="finish-delta" class="exact">—</span>
      </div>
      <button id="btn-promise" onclick="togglePromise()">до —</button>
    </div>
    <div id="promise-panel">
      <div class="fl">Обещанное время окончания</div>
      <div class="promise-row">
        <input class="ptime-inp" id="ph" type="number" min="0" max="23" value="16">
        <span style="color:var(--ink3);font-size:22px">:</span>
        <input class="ptime-inp" id="pm" type="number" min="0" max="59" value="00">
        <button onclick="applyPromise()" style="background:var(--ink);color:var(--cream);padding:10px 18px;font-size:13px;font-weight:600;letter-spacing:.04em;border-radius:var(--r)">ок</button>
        <button onclick="togglePromise()" style="background:var(--bg2);color:var(--ink3);padding:10px 14px;font-size:13px;border-radius:var(--r);border:1px solid var(--line)">×</button>
      </div>
    </div>

    <!-- DRAWER -->
    <div id="drawer">

      <!-- HINT section -->
      <div class="drawer-handle" onclick="toggleSection('hint')">
        <span class="drawer-handle-label">Подсказка</span>
        <span class="drawer-handle-icon open" id="dh-hint">▾</span>
      </div>
      <div class="drawer-section open" id="ds-hint">
        <div style="padding:14px 22px">
          <div id="hint-box">—</div>
        </div>
      </div>

      <!-- BLOCKS section -->
      <div class="drawer-handle" onclick="toggleSection('blocks')">
        <span class="drawer-handle-label">Блоки программы</span>
        <span class="drawer-handle-icon open" id="dh-blocks">▾</span>
      </div>
      <div class="drawer-section open" id="ds-blocks">
        <div style="padding:10px 22px 16px">
          <div id="total-row" style="margin-bottom:10px">
            <span id="total-label">0 / — мин</span>
            <div class="tot-bar"><div class="tot-fill" id="total-fill" style="width:0%"></div></div>
            <span id="total-end">до —</span>
          </div>
          <div id="block-list"></div>
        </div>
      </div>

      <!-- BALINT section -->
      <div id="balint-section-wrap">
        <div class="drawer-handle" onclick="toggleSection('balint')">
          <span class="drawer-handle-label" id="balint-section-label">Малые группы</span>
          <span class="drawer-handle-icon open" id="dh-balint">▾</span>
        </div>
        <div class="drawer-section" id="ds-balint">
          <div style="padding:12px 22px 16px">
            <div id="balint-panel">
              <div id="balint-header">
                <div id="balint-title">—</div>
                <div id="balint-badge" style="display:none">1 / 6</div>
              </div>
              <div id="bp-prog-wrap"><div id="bp-prog" style="width:0%"></div></div>
              <div id="balint-steps"></div>
              <div id="balint-nav" style="display:none">
                <button id="bp-prev-btn" onclick="prevPerson()">← предыдущий</button>
                <button id="bp-next-btn" onclick="nextPerson()">Следующий →</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ══ ADMIN PAGE ══ -->
  <div class="page" id="admin-page">
    <div class="admin-inner">

      <div class="admin-card">
        <div class="admin-title">Мероприятие</div>
        <div>
          <div class="fl">Название сессии</div>
          <input class="fi" id="cfg-title" type="text" value="Служба продаж · 10 сентября" oninput="applyMeta()">
        </div>
        <div>
          <div class="fl">Обещание участникам — время окончания</div>
          <div class="fi-row">
            <input class="fi fi-num" id="cfg-ph" type="number" value="16" oninput="applyMeta()">
            <span class="sep">:</span>
            <input class="fi fi-num" id="cfg-pm" type="number" value="00" oninput="applyMeta()">
          </div>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-title">Блоки программы</div>
        <div id="block-editors"></div>
        <button class="add-row" onclick="addBlock()">+ добавить блок</button>
      </div>

      <div class="admin-card">
        <div class="balint-toggle-row">
          <div style="flex:1;margin-right:14px">
            <div class="admin-title">Малые группы / инструмент</div>
            <div style="margin-top:6px">
              <div class="fl">Количество участников</div>
              <div class="fi-row">
                <input class="fi fi-num" id="cfg-balint-count" type="number" min="1" max="30" value="6" oninput="applyMeta()">
                <span style="font-size:13px;color:var(--ink3)">чел.</span>
              </div>
            </div>
          </div>
          <div class="toggle on" id="balint-toggle" onclick="toggleBalint()"></div>
        </div>
        <div id="balint-editors" style="margin-top:4px"></div>
        <button class="add-row" id="btn-add-balint" onclick="addBalint(BLOCKS.findIndex(b=>b.balint))">+ добавить мини группу</button>
      </div>

      <button class="btn-apply" onclick="applyAndGo()">Применить и перейти к сессии →</button>
      <button class="btn-reset" onclick="resetToDefault()">Сбросить к шаблону «10 сентября»</button>

    </div>
  </div>

</div>
<div id="flash"></div>

<script>
// ══ DATA ══
const DEFAULT_BLOCKS=[
  {time:'12:00',name:'Сбор · представление ведущих',dur:3,hint:'Проверить, что все в Zoom. Представить Антона, Романа, Анну.'},
  {time:'12:03',name:'Рамка и правила',dur:3,hint:'Формат дня: тройки → перерыв → балинт. Конфиденциальность, камеры.'},
  {time:'12:06',name:'Теория: три тезиса',dur:5,hint:'Три тезиса кратко. Без лекции — это введение в опыт, не объяснение.'},
  {time:'12:11',name:'Телесная практика',dur:7,hint:'Ведущий ведёт. Медленно. Дать время осесть.'},
  {time:'12:18',name:'Шеринг: состояние',dur:3,hint:'«Одно слово или образ — как вы сейчас». По кругу, без обсуждения.'},
  {time:'12:21',name:'Вопросы из интереса — демо',dur:2,hint:'Показать разницу между вопросом из интереса и вопросом-советом.'},

const DEFAULT_BALINT_STEPS=[
  {name:'Рассказ ситуации',note:'без перебиваний',dur:3},
  {name:'Уточняющие вопросы',note:'только факты',dur:5},
  {name:'Круг чувств',note:'«что я почувствовал, пока слушал»',dur:5},
  {name:'Круг ассоциаций',note:'сцена / картина / что чувствует другой',dur:5},
  {name:'Возврат автора',note:'«что откликнулось» — без спора',dur:3},
  {name:'Финальное слово ведущего',note:'одна фраза про тему',dur:2},
];

// ══ STATE ══
function makeDefaultSteps(){return J(DEFAULT_BALINT_STEPS);}
let BLOCKS=J(DEFAULT_BLOCKS).map(b=>b.balint?{...b,steps:makeDefaultSteps()}:b);
let showBalint=true, balintPersonCount=6, balintPerson=1;
function curSteps(){return BLOCKS[cur].steps||[]}
let sessionTitle='Служба продаж · 10 сентября', promiseMin=16*60;
let cur=0, playing=false, secsLeft=0, secsTotal=0;
let warnedAt2=false, warnedAt1=false, balintStep=0, tickId=null;
function J(x){return JSON.parse(JSON.stringify(x))}
function totalMins(){return BLOCKS.reduce((s,b)=>s+b.dur,0)}

// ══ TABS ══
function showTab(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id+'-page').classList.add('active');
  document.getElementById('tbtn-'+id).classList.add('active');
  if(id==='admin')renderAdminBlocks();
}

// ══ DRAWER SECTIONS ══
const sections={hint:true, blocks:true, balint:true};
function toggleSection(id){
  sections[id]=!sections[id];
  const ds=document.getElementById('ds-'+id);
  const dh=document.getElementById('dh-'+id);
  if(sections[id]){
    ds.classList.remove('closed');
    ds.classList.add('open');
    ds.style.maxHeight='';
  } else {
    ds.classList.remove('open');
    ds.style.maxHeight=ds.scrollHeight+'px';
    requestAnimationFrame(()=>{ ds.classList.add('closed'); ds.style.maxHeight=''; });
  }
  if(dh) dh.classList.toggle('open',sections[id]);
}

// ══ TIMER ══
function loadBlock(idx, animate){
  cur=Math.max(0,Math.min(idx,BLOCKS.length-1));
  warnedAt2=false; warnedAt1=false; balintStep=0; balintPerson=1;
  const b=BLOCKS[cur];
  secsTotal=b.dur*60; secsLeft=secsTotal;
  if(animate) flashSwitch();
  render();
}

function togglePlay(){
  if(playing) pause(); else play();
}
function play(){
  playing=true;
  document.getElementById('btn-play').textContent='⏸ пауза';
  document.getElementById('btn-play').classList.add('playing');
  if(tickId) clearInterval(tickId);
  tickId=setInterval(tick,1000);
}
function pause(){
  playing=false;
  document.getElementById('btn-play').textContent='▶ продолжить';
  document.getElementById('btn-play').classList.remove('playing');
  clearInterval(tickId);
}
function tick(){
  if(secsLeft>0) secsLeft--;
  checkWarn();
  render();
}

// SMART NEXT: inside balint block — go through steps
function nextAction(){
  const b=BLOCKS[cur];
  if(b.balint && showBalint && curSteps().length>0){
    if(balintStep < curSteps().length-1){
      setBalintStep(balintStep+1);
    } else if(balintPersonCount>1 && balintPerson<balintPersonCount){
      nextPerson();
    } else {
      if(cur<BLOCKS.length-1){ loadBlock(cur+1,true); if(playing)play(); }
    }
  } else {
    if(cur<BLOCKS.length-1){ loadBlock(cur+1,true); if(playing)play(); }
  }
}

function prevAction(){
  const b=BLOCKS[cur];
  if(b.balint && showBalint && balintStep>0){
    setBalintStep(balintStep-1);
  } else if(b.balint && showBalint && balintPerson>1){
    prevPerson();
  } else {
    if(cur>0){ loadBlock(cur-1, true); if(playing) play(); }
  }
}

function checkWarn(){
  if(secsLeft===120&&!warnedAt2){warnedAt2=true; flashWarn();}
  if(secsLeft===60&&!warnedAt1){warnedAt1=true; flashWarn(); vib();}
}
function flashSwitch(){
  const h=document.getElementById('hero');
  h.classList.remove('switching');
  void h.offsetWidth;
  h.classList.add('switching');
  setTimeout(()=>h.classList.remove('switching'),600);
}
function flashWarn(){
  const f=document.getElementById('flash');
  f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
}
function vib(){if('vibrate' in navigator) navigator.vibrate([200,100,200]);}

// ══ RENDER ══
function render(){
  const b=BLOCKS[cur];
  const m=Math.floor(secsLeft/60), s=secsLeft%60;
  const warn=secsLeft<=120&&secsLeft>60, urgent=secsLeft<=60;
  const cls=urgent?'urgent':warn?'warn':'';

  // hero
  document.getElementById('hero-label').textContent='блок '+(cur+1)+' / '+BLOCKS.length;
  document.getElementById('hero-name').textContent=b.name;
  const ht=document.getElementById('hero-timer');
  ht.textContent=pad(m)+':'+pad(s); ht.className=cls;
  const pct=secsTotal>0?(secsTotal-secsLeft)/secsTotal*100:100;
  const hp=document.getElementById('hero-prog');
  hp.style.width=pct+'%'; hp.className=cls;
  document.getElementById('hero-planned').textContent='план '+b.dur+' мин';
  document.getElementById('hero-elapsed').textContent=fmtSec(secsTotal-secsLeft)+' прошло';

  const elapsed=calcElapsed(), tot=totalMins();
  document.getElementById('total-fill').style.width=Math.min(elapsed/tot*100,100)+'%';
  document.getElementById('total-label').textContent=Math.round(elapsed)+' / '+tot+' мин';

  updateFinish(elapsed);
  renderBlockList();
  renderBalint();
  document.getElementById('hint-box').textContent=b.hint||'—';

  // balint section visibility
  const bwrap=document.getElementById('balint-section-wrap');
  if(bwrap) bwrap.style.display='none';
}

function calcElapsed(){
  let m=0; for(let i=0;i<cur;i++) m+=BLOCKS[i].dur;
  return m+(secsTotal-secsLeft)/60;
}

function updateFinish(elapsed){
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const est=nowMin+(totalMins()-elapsed);
  const delta=Math.round(promiseMin-est);
  document.getElementById('finish-text').textContent='закончим в '+fmtHM(est);
  document.getElementById('finish-icon').textContent=Math.abs(delta)<=1?'🟡':delta>0?'🟢':'🔴';
  const de=document.getElementById('finish-delta');
  if(Math.abs(delta)<=1){de.textContent='точно';de.className='exact';}
  else if(delta>0){de.textContent='+'+delta+' мин';de.className='ahead';}
  else{de.textContent=Math.abs(delta)+' мин';de.className='behind';}
  document.getElementById('btn-promise').textContent='до '+fmtHM(promiseMin);
  document.getElementById('total-end').textContent='до '+fmtHM(est);
}

function renderBlockList(){
  const isBalint=BLOCKS[cur].balint&&showBalint;
  document.getElementById('block-list').innerHTML=BLOCKS.map((b,i)=>{
    const cls=i<cur?'done':i===cur?'active':'';
    let html='<div class="brow '+cls+'" onclick="jumpTo('+i+')">'+
      '<span class="bt">'+b.time+'</span>'+
      '<span class="bn">'+esc(b.name)+'</span>'+
      '<span class="bd">'+(b.dur>0?b.dur+'м':'—')+'</span>'+
      '</div>';
    if(i===cur&&isBalint) html+='<div id="balint-inline">'+renderBalintHTML()+'</div>';
    return html;
  }).join('');
  setTimeout(()=>{
    const a=document.querySelector('.brow.active');
    if(a) a.scrollIntoView({block:'nearest',behavior:'smooth'});
  },50);
}

function renderBalintHTML(){
  const b=BLOCKS[cur];
  if(!b||!b.balint) return '';
  if(!b.steps||b.steps.length===0) b.steps=makeDefaultSteps();
  const steps=curSteps();
  const multi=balintPersonCount>1;
  const isLastPerson=balintPerson>=balintPersonCount;
  const isLastStep=balintStep>=steps.length-1;

  let h='<div style="background:var(--bg2);border-left:3px solid var(--red);margin:2px 0 6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">';

  h+='<div style="display:flex;align-items:center;justify-content:space-between">';
  h+='<div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600">'+esc(b.name)+'</div>';
  if(multi) h+='<div style="font-size:13px;color:var(--red);font-weight:700">'+balintPerson+' / '+balintPersonCount+'</div>';
  h+='</div>';

  if(multi){
    const pct=((balintPerson-1)/balintPersonCount*100).toFixed(1);
    h+='<div style="height:3px;background:var(--line);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--red);border-radius:2px"></div></div>';
  }

  h+='<div>';
  h+=steps.map((s,i)=>{
    const done=i<balintStep,active=i===balintStep;
    return '<div onclick="setBalintStep('+i+')" style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start">'+
      '<span style="font-size:12px;color:'+(active?'var(--red)':'var(--ink3)')+';width:18px;flex:none;font-weight:'+(active?700:400)+'">'+(i+1)+'</span>'+
      '<span style="flex:1;font-size:14px;color:'+(active?'var(--ink)':done?'var(--ink3)':'var(--ink2)')+';font-weight:'+(active?700:400)+';text-decoration:'+(done?'line-through':'none')+';line-height:1.35">'+esc(s.name)+
        (s.note?'<span style="display:block;font-size:11px;color:var(--ink3);font-weight:400;text-decoration:none;margin-top:2px">'+esc(s.note)+'</span>':'')+
      '</span>'+
      '<span style="font-size:12px;color:var(--ink3);flex:none">'+s.dur+'м</span>'+
      '</div>';
  }).join('');
  h+='</div>';

  h+='<div style="display:flex;gap:8px">';
  h+='<button onclick="prevAction()" style="flex:1;padding:10px 0;border:1px solid var(--line);font-size:13px;font-weight:500;border-radius:4px;background:none;color:var(--ink2);cursor:pointer;font-family:inherit">← назад</button>';
  let nextLabel,nextBg;
  if(!isLastStep){ nextLabel='Шаг '+(balintStep+2)+' →'; nextBg='var(--ink)'; }
  else if(multi&&!isLastPerson){ nextLabel='Участник '+(balintPerson+1)+' →'; nextBg='var(--red)'; }
  else { nextLabel='✓ Завершить'; nextBg='var(--green2)'; }
  h+='<button onclick="nextAction()" style="flex:2;padding:10px 0;border:none;font-size:13px;font-weight:600;border-radius:4px;background:'+nextBg+';color:var(--cream);cursor:pointer;font-family:inherit">'+nextLabel+'</button>';
  h+='</div>';

  h+='</div>';
  return h;
}

function renderBalint(){
  const b=BLOCKS[cur];
  if(!b.balint||!showBalint) return;

  // ensure steps exist
  if(!b.steps||b.steps.length===0) b.steps=makeDefaultSteps();

  document.getElementById('balint-section-label').textContent=b.name;
  document.getElementById('balint-title').textContent=b.name;

  const multi=balintPersonCount>1;
  const badge=document.getElementById('balint-badge');
  const nav=document.getElementById('balint-nav');
  badge.style.display=multi?'block':'none';
  nav.style.display=multi?'flex':'none';
  if(multi){
    badge.textContent='участник '+balintPerson+' / '+balintPersonCount;
    document.getElementById('bp-prog').style.width=((balintPerson-1)/balintPersonCount*100)+'%';
    const isLast=balintPerson>=balintPersonCount;
    const nb=document.getElementById('bp-next-btn');
    nb.textContent=isLast?'✓ Все круги':'Следующий →';
    nb.className=isLast?'done':'';
  }

  const steps=curSteps();
  document.getElementById('balint-steps').innerHTML=steps.length>0
    ? steps.map((s,i)=>{
        const cls=i<balintStep?'bs-done':i===balintStep?'bs-active':'';
        return '<div class="bstep '+cls+'" onclick="setBalintStep('+i+')">'+
          '<span class="bsn">'+(i+1)+'</span>'+
          '<span class="bsname">'+esc(s.name)+'<span class="bsnote">'+esc(s.note)+'</span></span>'+
          '<span class="bsdur">'+s.dur+'м</span></div>';
      }).join('')
    : '<div style="font-size:13px;color:var(--ink3);padding:8px 0">Шаги не заданы — добавьте их в Настройках</div>';
}

function jumpTo(idx){loadBlock(idx,true);if(playing)play();}
function setBalintStep(i){
  balintStep=i; secsTotal=curSteps()[i].dur*60; secsLeft=secsTotal;
  warnedAt2=false; warnedAt1=false;
  render(); if(playing) play();
}
function nextPerson(){
  if(balintPerson<balintPersonCount){
    balintPerson++; balintStep=0;
    secsTotal=(curSteps()[0]||{dur:0}).dur*60; secsLeft=secsTotal;
    warnedAt2=false; warnedAt1=false;
    flashSwitch(); render(); if(playing) play();
  } else {
    if(cur<BLOCKS.length-1){ loadBlock(cur+1,true); if(playing)play(); }
  }
}
function prevPerson(){
  if(balintPerson>1){
    balintPerson--; balintStep=0;
    secsTotal=(curSteps()[0]||{dur:0}).dur*60; secsLeft=secsTotal;
    warnedAt2=false; warnedAt1=false;
    render(); if(playing) play();
  }
}

// ══ PROMISE ══
function togglePromise(){
  const p=document.getElementById('promise-panel');
  if(p.style.display==='block'){p.style.display='none';}
  else{
    p.style.display='block';
    document.getElementById('ph').value=pad(Math.floor(promiseMin/60)%24);
    document.getElementById('pm').value=pad(promiseMin%60);
  }
}
function applyPromise(){
  promiseMin=Math.min(23,+document.getElementById('ph').value||0)*60+Math.min(59,+document.getElementById('pm').value||0);
  document.getElementById('promise-panel').style.display='none';
  render();
}

// ══ ADMIN ══
function renderAdminBlocks(){
  document.getElementById('cfg-title').value=sessionTitle;
  document.getElementById('cfg-ph').value=pad(Math.floor(promiseMin/60)%24);
  document.getElementById('cfg-pm').value=pad(promiseMin%60);
  document.getElementById('cfg-balint-count').value=balintPersonCount;
  renderEditorList('block-editors',BLOCKS,makeBlockRow,'BLOCKS');
  renderBalintBlockEditors();
  document.getElementById('btn-add-balint').style.display=showBalint?'block':'none';
}

function makeBlockRow(b,i){
  return '<span class="drag-h">⠿</span>'+
    '<div class="be-fields">'+
    '<div class="be-top">'+
    '<input class="fi be-name" value="'+esc(b.name)+'" oninput="BLOCKS['+i+'].name=this.value" placeholder="Название">'+
    '<input class="fi fi-sm" type="number" min="0" value="'+b.dur+'" oninput="BLOCKS['+i+'].dur=+this.value" placeholder="мин">'+
    '</div>'+
    '<textarea class="fi fi-ta" oninput="BLOCKS['+i+'].hint=this.value" placeholder="Подсказка...">'+esc(b.hint||'')+'</textarea>'+
    '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);cursor:pointer;margin-top:2px">'+
    '<input type="checkbox" '+(b.balint?'checked':'')+' onchange="BLOCKS['+i+'].balint=this.checked" style="accent-color:var(--red)"> малая группа</label>'+
    '</div>'+
    '<button class="be-del" onclick="delBlock('+i+')">×</button>';
}

function makeBalintRow(s,si,bi){
  return '<span class="drag-h">⠿</span>'+
    '<div class="be-fields">'+
    '<div class="be-top">'+
    '<input class="fi be-name" value="'+esc(s.name)+'" oninput="BLOCKS['+bi+'].steps['+si+'].name=this.value" placeholder="Название шага">'+
    '<input class="fi fi-sm" type="number" min="0" value="'+s.dur+'" oninput="BLOCKS['+bi+'].steps['+si+'].dur=+this.value" placeholder="мин">'+
    '</div>'+
    '<input class="fi" value="'+esc(s.note)+'" oninput="BLOCKS['+bi+'].steps['+si+'].note=this.value" placeholder="Примечание">'+
    '</div>'+
    '<button class="be-del" onclick="delBalint('+bi+','+si+')">×</button>';
}

function renderBalintBlockEditors(){
  const container=document.getElementById('balint-editors');
  if(!showBalint){container.style.display='none';return;}
  container.style.display='block';
  const balintBlocks=BLOCKS.filter(b=>b.balint);
  if(balintBlocks.length===0){container.innerHTML='<div style="font-size:12px;color:var(--ink3);padding:8px 0">Нет блоков с флагом «малая группа»</div>';return;}
  container.innerHTML=balintBlocks.map(b=>{
    const bi=BLOCKS.indexOf(b);
    const steps=b.steps||[];
    return '<div style="margin-bottom:16px">'+
      '<div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:8px;font-weight:600">'+esc(b.name)+'</div>'+
      '<div id="be-steps-'+bi+'">'+
      steps.map((s,si)=>
        '<div class="be" data-idx="'+si+'" data-bi="'+bi+'"><div class="be-row"><span class="be-idx">'+(si+1)+'</span>'+makeBalintRow(s,si,bi)+'</div></div>'
      ).join('')+
      '</div>'+
      '<button class="add-row" style="margin-top:6px" onclick="addBalint('+bi+')">+ шаг для «'+esc(b.name.slice(0,24))+'»</button>'+
      '</div>';
  }).join('<div style="height:1px;background:var(--line);margin:4px 0 16px"></div>');
  // init drag for each
  balintBlocks.forEach(b=>{
    const bi=BLOCKS.indexOf(b);
    const c=document.getElementById('be-steps-'+bi);
    if(c) initDrag(c, b.steps||(b.steps=[]));
  });
}
function renderEditorList(cid, arr, rowFn, arrName){
  const c=document.getElementById(cid);
  c.innerHTML=arr.map((item,i)=>
    '<div class="be" data-idx="'+i+'" data-arr="'+arrName+'">'+
    '<div class="be-row"><span class="be-idx">'+(i+1)+'</span>'+rowFn(item,i)+'</div></div>'
  ).join('');
  initDrag(c, arrName==='BLOCKS'?BLOCKS:BALINT);
}

function initDrag(container, arr){
  let dragIdx=null, overIdx=null;
  container.querySelectorAll('.be').forEach(row=>{
    const handle=row.querySelector('.drag-h');
    const idx=+row.dataset.idx;
    handle.addEventListener('mousedown',()=>{row.draggable=true});
    row.addEventListener('dragstart',e=>{dragIdx=idx;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{
      row.draggable=false;row.classList.remove('dragging');
      container.querySelectorAll('.be').forEach(r=>r.classList.remove('drag-over'));
      if(dragIdx!==null&&overIdx!==null&&dragIdx!==overIdx){
        const m=arr.splice(dragIdx,1)[0];arr.splice(overIdx,0,m);renderAdminBlocks();
      }
      dragIdx=null;overIdx=null;
    });
    row.addEventListener('dragover',e=>{
      e.preventDefault();overIdx=idx;
      container.querySelectorAll('.be').forEach(r=>r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    let startY=0,clone=null;
    handle.addEventListener('touchstart',e=>{
      dragIdx=idx;startY=e.touches[0].clientY;
      clone=row.cloneNode(true);
      clone.style.cssText='position:fixed;left:18px;right:18px;z-index:999;opacity:.85;pointer-events:none;';
      clone.style.top=row.getBoundingClientRect().top+'px';
      document.body.appendChild(clone);
      row.classList.add('dragging');
    },{passive:true});
    handle.addEventListener('touchmove',e=>{
      e.preventDefault();const y=e.touches[0].clientY;
      if(clone)clone.style.top=(row.getBoundingClientRect().top+(y-startY))+'px';
      container.querySelectorAll('.be:not(.dragging)').forEach(el=>{
        container.querySelectorAll('.be').forEach(r=>r.classList.remove('drag-over'));
        const rect=el.getBoundingClientRect();
        if(y>rect.top&&y<rect.bottom){overIdx=+el.dataset.idx;el.classList.add('drag-over');}
      });
    },{passive:false});
    handle.addEventListener('touchend',()=>{
      if(clone){clone.remove();clone=null;}
      row.classList.remove('dragging');
      container.querySelectorAll('.be').forEach(r=>r.classList.remove('drag-over'));
      if(dragIdx!==null&&overIdx!==null&&dragIdx!==overIdx){
        const m=arr.splice(dragIdx,1)[0];arr.splice(overIdx,0,m);renderAdminBlocks();
      }
      dragIdx=null;overIdx=null;
    });
  });
}

function delBlock(i){if(BLOCKS.length>1){BLOCKS.splice(i,1);renderAdminBlocks();}}
function delBalint(blockIdx,stepIdx){const b=BLOCKS[blockIdx];if(b.steps&&b.steps.length>1){b.steps.splice(stepIdx,1);renderAdminBlocks();}}
function addBlock(){
  BLOCKS.push({time:'—',name:'Новый блок',dur:5,hint:''});
  renderAdminBlocks();
  setTimeout(()=>{const l=document.querySelector('#block-editors .be:last-child');if(l)l.scrollIntoView({behavior:'smooth',block:'center'});},50);
}
function addBalint(blockIdx){
  const b=BLOCKS[blockIdx];
  if(!b.steps) b.steps=[];
  b.steps.push({name:'Новый шаг',note:'',dur:3});
  renderAdminBlocks();
  setTimeout(()=>{const l=document.querySelector('#balint-editors .be:last-child');if(l)l.scrollIntoView({behavior:'smooth',block:'center'});},50);
}
function applyMeta(){
  sessionTitle=document.getElementById('cfg-title').value;
  promiseMin=Math.min(23,+document.getElementById('cfg-ph').value||0)*60+Math.min(59,+document.getElementById('cfg-pm').value||0);
  balintPersonCount=Math.max(1,+document.getElementById('cfg-balint-count').value||1);
}
function toggleBalint(){
  showBalint=!showBalint;
  document.getElementById('balint-toggle').className='toggle'+(showBalint?' on':'');
  document.getElementById('balint-editors').style.display=showBalint?'block':'none';
  document.getElementById('btn-add-balint').style.display=showBalint?'block':'none';
}
function applyAndGo(){
  let h=parseInt((BLOCKS[0].time||'12:00').split(':')[0])||12;
  let m=parseInt((BLOCKS[0].time||'12:00').split(':')[1])||0;
  BLOCKS.forEach(b=>{b.time=pad(h%24)+':'+pad(m);m+=b.dur;h+=Math.floor(m/60);m=m%60;});
  if(cur>=BLOCKS.length)cur=0;
  loadBlock(cur,false); showTab('session');
}
function resetToDefault(){
  BLOCKS=J(DEFAULT_BLOCKS).map(b=>b.balint?{...b,steps:makeDefaultSteps()}:b);
  sessionTitle='Служба продаж · 10 сентября'; promiseMin=16*60;
  showBalint=true; balintPersonCount=6; balintPerson=1;
  renderAdminBlocks();
}

// ══ FONT SIZE ══
const FONT_SIZES=[
  {label:'А',  timer:'84px', name:'20px', hint:'14px', bn:'15px', bname:'20px'},
  {label:'АА', timer:'100px',name:'24px', hint:'17px', bn:'18px', bname:'24px'},
];
let fontIdx=0;
function cycleFontSize(){
  fontIdx=(fontIdx+1)%FONT_SIZES.length;
  applyFontSize();
}
function applyFontSize(){
  const f=FONT_SIZES[fontIdx];
  document.getElementById('btn-font').textContent=f.label;
  document.getElementById('hero-timer').style.fontSize=f.timer;
  document.getElementById('hero-name').style.fontSize=f.name;
  document.getElementById('hint-box').style.fontSize=f.hint;
  document.querySelectorAll('.bn').forEach(el=>el.style.fontSize=f.bn);
  document.querySelectorAll('.brow.active .bn').forEach(el=>el.style.fontSize=f.bname);
}

// ══ CLOCK ══
function tickClock(){
  const d=new Date();
  document.getElementById('hero-clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

// ══ UTILS ══
function pad(n){return String(Math.max(0,Math.floor(n))).padStart(2,'0');}
function fmtSec(s){return Math.floor(s/60)+':'+pad(s%60);}
function fmtHM(t){const h=Math.floor(t/60)%24,m=Math.round(t%60);return pad(h)+':'+pad(m<60?m:59);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

// ══ INIT ══
loadBlock(0,false);
setInterval(tickClock,1000);
tickClock();
// init drawer sections — set open ones to auto height
requestAnimationFrame(()=>{
  ['hint','blocks','balint'].forEach(id=>{
    const ds=document.getElementById('ds-'+id);
    if(ds && sections[id]){ ds.classList.add('open'); ds.style.maxHeight=''; }
  });
});
</script>
